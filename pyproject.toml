[project]
name = "lol-reasoner"
version = "0.1.0"
description = "Motor de razonamiento mecánico y trazable para matchups de top lane en League of Legends (V0 / prueba de concepto)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lol_reasoner.knowledge" = ["champions/*.yaml"]
"lol_reasoner.config" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
