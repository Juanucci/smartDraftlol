# Pesos centralizados del motor de scoring. Todos heurísticos (ver
# docs/decisiones-tecnicas.md): no están calibrados contra datos reales,
# solo reflejan qué tan seguido queremos que un factor mueva el resultado
# final en esta V0.

# NO hay un factor execution_demand: GlobalScore mide adecuación mecánica
# teórica suponiendo ejecución competente (hito 1.6). La exigencia de
# ejecución solo afecta PersonalScore, vía `personal.execution_demand_weight`
# más abajo, nunca este bloque.
factors:
  mechanical_interaction: 1.0
  lane_pattern: 0.85
  reliability: 0.6
  stacking_payoff: 0.7
  scaling_sidelane: 0.7

phases:
  early_lane: 1.0
  level_6: 0.9
  first_item: 0.8
  side_lane_late: 0.8

# Multiplicador por nivel de certeza (domain.enums.Support). HEURÍSTICO y
# SIN CALIBRAR, como todo este archivo: no es una probabilidad ni una
# frecuencia observada. Es la respuesta a "¿cuánto debería inclinar el
# score una ventaja que es real pero depende de una circunstancia?".
#   - structural  = 1.0: se sostiene siempre que ambos kits estén en la fase.
#   - conditioned = 0.45: inclina, pero no se vuelve certeza. Deliberadamente
#     por debajo de 0.5 para que una ventaja condicionada nunca pese como
#     media ventaja estructural.
#   - ambiguous   = 0.0: doble filo real; aporta cero al score y se conserva
#     entera en la explicación.
# Cada entrada de la traza expone su `support`, así que el efecto de estos
# números es auditable entrada por entrada.
support:
  structural: 1.0
  conditioned: 0.45
  ambiguous: 0.0

# Multiplicador por procedencia (domain.enums.Provenance).
#   - derived = 1.0: el hecho se deriva del kit modelado.
#   - editorial_prior = 0.0: un eje 0..4 escrito a mano NO mueve el score
#     mecánico. Se conserva íntegro en la traza y en la salida, etiquetado
#     como valoración manual, pero no decide nada.
#
# Por qué 0 y no un peso chico: con 0.25, el aporte de `early_pressure`
# (+0.0638) era mayor que la diferencia mecánica real entre los dos
# candidatos, así que la ventaja publicada NO se derivaba del kit — se
# invertía al quitar el prior. Un peso "pequeño pero decisivo" es peor que
# ninguno: disfraza de conclusión derivada algo que nadie derivó.
provenance:
  derived: 1.0
  editorial_prior: 0.0

# GlobalScore = clamp(50 + scale * sum(phase_w * factor_w * support_w * provenance_w * signed_delta), 0, 100)
global_scale: 12.0

# PersonalScore = clamp(global_score + execution_sensitivity * gap/100, 0, 100)
# donde gap = mastery - required_skill, y
# required_skill = base_required_skill
#                  + execution_demand_weight * axes.execution_demand
#                  + reliability_penalty_weight * n_condiciones_EXECUTION_distintas_del_candidato
# Solo condition_kind=EXECUTION cuenta acá (ver domain.enums.ConditionKind):
# información faltante, ausencia de objetos o incertidumbre estratégica
# (STRATEGIC/KNOWLEDGE_GAP) NO suben required_skill.
personal:
  execution_sensitivity: 22.0
  base_required_skill: 25.0
  execution_demand_weight: 9.0
  reliability_penalty_weight: 5.0
